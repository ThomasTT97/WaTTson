name = "wattson-coach"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Cloudflare Pages Configuration:
# - Build command: npm run build
# - Build output directory: dist
# - Backend functions: Cloudflare Pages automatically discovers and mounts /functions/api/*
#   * /functions/api/gemini/generate.ts -> Handles server-side AI requests
#   * /functions/api/intervals-proxy/[[path]].ts -> Handles Intervals.icu CORS proxy
#
# Environment Variables required in Cloudflare Pages dashboard:
#   * GEMINI_API_KEY (Your Gemini API Key)


